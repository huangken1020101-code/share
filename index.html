<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網站分享平台</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 正式連接 Firebase Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, doc, getDoc, writeBatch, runTransaction, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: 'AIzaSyA718QCBHbLYgB6hopPSSgTWUzCfb8pENU',
            authDomain: 'towerdefense-save.firebaseapp.com',
            projectId: 'towerdefense-save',
            storageBucket: 'towerdefense-save.firebasestorage.app',
            messagingSenderId: '507422966076',
            appId: '1:507422966076:web:986f6aae8bf4eb672d9e39'
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        window.firebaseDB = db;
        window.firebaseAPI = { collection, getDocs, addDoc, updateDoc, doc, getDoc, writeBatch, runTransaction, Timestamp };
    </script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const MAX_IMAGE_SIZE = 5 * 1024 * 1024;
        const CLOUDINARY_CLOUD_NAME = "zey1dc4y";
        const CLOUDINARY_UPLOAD_PRESET = "game_share_images";
        const IMAGE_EXTENSIONS = {
            "image/jpeg": "jpg",
            "image/png": "png",
            "image/webp": "webp",
            "image/gif": "gif"
        };
        const accountKey = email => encodeURIComponent(email.trim().toLowerCase());
        const normalizeEmail = email => String(email || "").trim().toLowerCase();
        const DELETE_GRACE_PERIOD_MS = 3 * 24 * 60 * 60 * 1000;
        const timestampMillis = value => value && typeof value.toMillis === "function" ? value.toMillis() : 0;
        const isDeletedSite = site => Boolean(site.deletedAt);
        const normalizeSiteUrl = value => {
            const input = value.trim();
            const url = new URL(/^[a-z][a-z\d+.-]*:/i.test(input) ? input : `https://${input}`);
            if (!["http:", "https:"].includes(url.protocol)) {
                throw new Error("網址必須使用 http:// 或 https://。");
            }
            return url.href;
        };
        const isGeminiShareUrl = value => {
            const url = String(value || "").trim();
            return /^https?:\/\/share\.gemini\.google(?:[/:?#]|$)/i.test(url) ||
                /^https?:\/\/gemini\.google\.com\/share\//i.test(url);
        };
        const getListingManagerEmail = game => {
            if (game.delegation?.status === "accepted") {
                return normalizeEmail(game.delegation.originalEmail);
            }
            return normalizeEmail(game.delegation?.delegateEmail || game.authorEmail);
        };

        const getRatingStats = ratings => {
            const validRatings = (Array.isArray(ratings) ? ratings : []).filter(
                rating => Number.isInteger(rating.value) && rating.value >= 1 && rating.value <= 5
            );
            const total = validRatings.reduce((sum, rating) => sum + rating.value, 0);
            return {
                count: validRatings.length,
                average: validRatings.length ? total / validRatings.length : 0
            };
        };

        const renameCommentAuthors = (comments, email, nickname) => {
            let changed = false;
            const renamedComments = (comments || []).map(comment => {
                const authorEmail = normalizeEmail(comment.authorEmail);
                const isMatchingAuthor = authorEmail
                    ? authorEmail === email
                    : normalizeEmail(comment.author) === email;
                const replies = renameCommentAuthors(comment.replies, email, nickname);
                if (isMatchingAuthor || replies.changed) changed = true;
                return {
                    ...comment,
                    ...(isMatchingAuthor ? { author: nickname, authorEmail: email } : {}),
                    ...(replies.changed ? { replies: replies.comments } : {})
                };
            });
            return { comments: renamedComments, changed };
        };

        const uploadGameImage = async (file) => {
            if (!file) return null;
            if (!IMAGE_EXTENSIONS[file.type]) {
                throw new Error("圖片格式僅支援 JPG、PNG、WebP 或 GIF。");
            }
            if (file.size >= MAX_IMAGE_SIZE) {
                throw new Error("圖片大小必須小於 5 MB。");
            }

            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

            const response = await fetch(
                `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
                { method: "POST", body: formData }
            );
            const result = await response.json();
            if (!response.ok) {
                throw new Error(result.error?.message || `Cloudinary 上傳失敗（HTTP ${response.status}）。`);
            }
            if (!result.secure_url) {
                throw new Error("Cloudinary 未回傳圖片網址，請檢查 Upload preset 設定。");
            }
            return result.secure_url;
        };

        const ImageUploadField = ({ file, onFileChange, currentImage, inputId }) => {
            const [previewUrl, setPreviewUrl] = useState("");

            useEffect(() => {
                if (!file) {
                    setPreviewUrl("");
                    return;
                }
                const url = URL.createObjectURL(file);
                setPreviewUrl(url);
                return () => URL.revokeObjectURL(url);
            }, [file]);

            return (
                <div className="space-y-2">
                    <label htmlFor={inputId} className="block text-sm font-medium text-gray-700">遊戲示意圖（選擇圖片直接上傳，需小於 5 MB）</label>
                    <input
                        id={inputId}
                        type="file"
                        accept="image/jpeg,image/png,image/webp,image/gif"
                        className="border p-2 w-full rounded"
                        onChange={e => onFileChange(e.target.files[0] || null)}
                    />
                    <p className="text-xs text-gray-500">圖片會透過 Cloudinary Unsigned Upload preset 上傳；請在 preset 限制圖片格式與大小。頁面上的 Email 登入僅供顯示名稱使用。</p>
                    {(previewUrl || currentImage) && (
                        <div className="flex items-start gap-3">
                            <img src={previewUrl || currentImage} alt="圖片預覽" className="w-24 h-16 object-cover rounded border" />
                            {file && (
                                <button
                                    type="button"
                                    onClick={() => {
                                        onFileChange(null);
                                        document.getElementById(inputId).value = "";
                                    }}
                                    className="text-sm text-red-600 hover:underline"
                                >
                                    移除選取圖片
                                </button>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const CommentBlock = ({ comment, currentUser, onReply }) => {
            const [replyText, setReplyText] = useState("");
            const [showReplyBox, setShowReplyBox] = useState(false);

            const handleReply = () => {
                if (!replyText.trim()) return;
                onReply(comment.id, replyText);
                setReplyText("");
                setShowReplyBox(false);
            };

            return (
                <div className="border-l-2 border-blue-200 pl-4 mt-3 ml-2">
                    <div className="bg-white p-3 rounded shadow-sm">
                        <p className="text-xs text-gray-500 font-bold">{comment.author}</p>
                        <p className="text-gray-800 mt-1">{comment.text}</p>
                        {currentUser && (
                            <button onClick={() => setShowReplyBox(!showReplyBox)} className="text-blue-500 text-sm mt-2 hover:underline">
                                回覆
                            </button>
                        )}
                        {showReplyBox && (
                            <div className="mt-2 flex gap-2">
                                <input type="text" value={replyText} onChange={e => setReplyText(e.target.value)} className="border p-1 rounded flex-1 text-sm" placeholder="輸入回覆..." />
                                <button onClick={handleReply} className="bg-blue-500 text-white px-3 py-1 rounded text-sm">送出</button>
                            </div>
                        )}
                    </div>
                    {comment.replies && comment.replies.map(reply => (
                        <CommentBlock key={reply.id} comment={reply} currentUser={currentUser} onReply={onReply} />
                    ))}
                </div>
            );
        };

        const RatingSection = ({ ratings, currentUser, onRate }) => {
            const stats = getRatingStats(ratings);
            const myRating = (ratings || []).find(
                rating => normalizeEmail(rating.userEmail) === normalizeEmail(currentUser)
            )?.value || 0;

            return (
                <section className="border-t border-b py-4 my-5" aria-label="遊戲評分">
                    <h3 className="font-bold text-gray-700 mb-2">玩家評分</h3>
                    <p className="text-sm text-gray-600 mb-2">
                        {stats.count ? `平均 ${stats.average.toFixed(1)} / 5（${stats.count} 人評分）` : "尚無評分"}
                    </p>
                    {currentUser ? (
                        <>
                            <div className="flex items-center gap-1" role="group" aria-label="選擇 1 到 5 星">
                                {[1, 2, 3, 4, 5].map(score => (
                                    <button
                                        key={score}
                                        type="button"
                                        onClick={() => onRate(score)}
                                        aria-label={`${score} 星`}
                                        aria-pressed={myRating === score}
                                        title={`${score} 星`}
                                        className={`text-2xl ${score <= myRating ? "text-yellow-500" : "text-gray-300"} hover:text-yellow-500`}
                                    >
                                        ★
                                    </button>
                                ))}
                                <span className="ml-2 text-sm text-gray-600">
                                    {myRating ? `你的評分：${myRating} 星（可再次點選修改）` : "點選星星評分"}
                                </span>
                            </div>
                        </>
                    ) : (
                        <p className="text-sm text-gray-500">登入後即可評分。</p>
                    )}
                </section>
            );
        };

        function App() {
            const [user, setUser] = useState(null);
            const [loginInput, setLoginInput] = useState("");
            const [loginPassword, setLoginPassword] = useState("");
            const [accountData, setAccountData] = useState({ nickname: "", password: "", hidePasswordPrompt: false });
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const [showPasswordSetup, setShowPasswordSetup] = useState(false);
            const [setupPassword, setSetupPassword] = useState("");
            const [hidePasswordPrompt, setHidePasswordPrompt] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [settingsNickname, setSettingsNickname] = useState("");
            const [settingsCurrentPassword, setSettingsCurrentPassword] = useState("");
            const [settingsNewPassword, setSettingsNewPassword] = useState("");
            const [isSavingSettings, setIsSavingSettings] = useState(false);
            const [games, setGames] = useState([]);
            const [hasLoadedGames, setHasLoadedGames] = useState(false);
            const [currentTime, setCurrentTime] = useState(Date.now());
            const [searchQuery, setSearchQuery] = useState("");
            const [activeGame, setActiveGame] = useState(null);
            const [activeTab, setActiveTab] = useState("game");
            const [showDeletedSites, setShowDeletedSites] = useState(false);
            const [showDeleteConfirmation, setShowDeleteConfirmation] = useState(false);
            const [deleteConfirmationText, setDeleteConfirmationText] = useState("");
            const [isDeletingSite, setIsDeletingSite] = useState(false);
            const [restoringSiteId, setRestoringSiteId] = useState("");
            const [showDelegationInbox, setShowDelegationInbox] = useState(false);
            const [isHandlingDelegation, setIsHandlingDelegation] = useState(false);
            
            // 發佈遊戲狀態
            const [showAddGame, setShowAddGame] = useState(false);
            const [newGameForm, setNewGameForm] = useState({ title: '', url: '', type: 'game', image: '', imageFile: null, description: '', authorKeywords: '', isDelegated: false, originalAuthorEmail: '', originalAuthorName: '' });
            const [isSavingGame, setIsSavingGame] = useState(false);
            
            // 編輯遊戲狀態
            const [showEditGame, setShowEditGame] = useState(false);
            const [editGameForm, setEditGameForm] = useState({ id: '', title: '', url: '', type: 'game', image: '', imageFile: null, description: '', authorKeywords: '' });
            
            const [newPlayerKw, setNewPlayerKw] = useState("");

            useEffect(() => {
                const loadGames = async () => {
                    try {
                        const { collection, getDocs } = window.firebaseAPI;
                        const querySnapshot = await getDocs(collection(window.firebaseDB, "games"));
                        const gamesData = querySnapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                        setGames(gamesData);
                        setHasLoadedGames(true);
                    } catch (error) {
                        setHasLoadedGames(true);
                        console.error("讀取錯誤，請確認 Firestore 權限規則設定", error);
                    }
                };

                const checkFirebase = setInterval(() => {
                    if(window.firebaseAPI) {
                        clearInterval(checkFirebase);
                        loadGames();
                    }
                }, 100);
            }, []);

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(Date.now()), 60 * 1000);
                return () => clearInterval(timer);
            }, []);

            const pendingDelegationClaims = user && accountData.password
                ? games.filter(game =>
                    !isDeletedSite(game) &&
                    game.delegation?.status === "pending" &&
                    normalizeEmail(game.delegation.originalEmail) === normalizeEmail(user)
                )
                : [];

            useEffect(() => {
                if (pendingDelegationClaims.length) setShowDelegationInbox(true);
            }, [user, accountData.password, pendingDelegationClaims.map(game => game.id).join("|")]);

            const handleLogin = async () => {
                const email = normalizeEmail(loginInput);
                if (!email.endsWith("@gmail.com") && !email.endsWith("@st.tc.edu.tw")) {
                    alert("請使用 Google 帳號 (@gmail.com) 或 學校帳號 (@st.tc.edu.tw) 登入");
                    return;
                }

                setIsLoggingIn(true);
                try {
                    const { getDoc, doc } = window.firebaseAPI;
                    const accountSnapshot = await getDoc(doc(window.firebaseDB, "userAccounts", accountKey(email)));
                    const savedAccount = accountSnapshot.exists() ? accountSnapshot.data() : {};

                    if (savedAccount.password && loginPassword !== savedAccount.password) {
                        alert("密碼錯誤。");
                        return;
                    }

                    const nextAccountData = {
                        nickname: savedAccount.nickname || "",
                        password: savedAccount.password || "",
                        hidePasswordPrompt: savedAccount.hidePasswordPrompt === true
                    };
                    setUser(email);
                    setAccountData(nextAccountData);
                    setLoginPassword("");
                    if (!nextAccountData.password && !nextAccountData.hidePasswordPrompt) {
                        setSetupPassword("");
                        setHidePasswordPrompt(false);
                        setShowPasswordSetup(true);
                    }
                } catch (error) {
                    console.error("登入帳號資料讀取失敗", error);
                    alert(`登入失敗：${error.message || "無法讀取帳號資料，請確認 Firestore 權限。"}`);
                } finally {
                    setIsLoggingIn(false);
                }
            };

            const skipPasswordSetup = async () => {
                try {
                    if (hidePasswordPrompt) {
                        const { doc, writeBatch } = window.firebaseAPI;
                        const batch = writeBatch(window.firebaseDB);
                        batch.set(doc(window.firebaseDB, "userAccounts", accountKey(user)), {
                            hidePasswordPrompt: true
                        }, { merge: true });
                        await batch.commit();
                        setAccountData({ ...accountData, hidePasswordPrompt: true });
                    }
                    setShowPasswordSetup(false);
                } catch (error) {
                    console.error("儲存密碼提示設定失敗", error);
                    alert(`設定儲存失敗：${error.message || "請確認 Firestore 權限。"}`);
                }
            };

            const savePasswordSetup = async (e) => {
                e.preventDefault();
                if (!setupPassword.trim()) {
                    alert("請輸入要儲存的密碼值。");
                    return;
                }
                try {
                    const { doc, writeBatch } = window.firebaseAPI;
                    const batch = writeBatch(window.firebaseDB);
                    batch.set(doc(window.firebaseDB, "userAccounts", accountKey(user)), {
                        password: setupPassword,
                        nickname: accountData.nickname || "",
                        hidePasswordPrompt
                    }, { merge: true });
                    await batch.commit();
                    setAccountData({ ...accountData, password: setupPassword, hidePasswordPrompt });
                    setShowPasswordSetup(false);
                    setSetupPassword("");
                } catch (error) {
                    console.error("設定密碼值失敗", error);
                    alert(`密碼儲存失敗：${error.message || "請確認 Firestore 權限。"}`);
                }
            };

            const openSettings = () => {
                setSettingsNickname(accountData.nickname || "");
                setSettingsCurrentPassword("");
                setSettingsNewPassword("");
                setShowSettings(true);
            };

            const saveNickname = async (e) => {
                e.preventDefault();
                const nickname = settingsNickname.trim();
                const email = normalizeEmail(user);
                if (!nickname) {
                    alert("暱稱不可空白。");
                    return;
                }

                setIsSavingSettings(true);
                try {
                    const changedGames = [];
                    for (const game of games) {
                        const gameAuthorEmail = normalizeEmail(game.authorEmail);
                        const isMatchingAuthor = gameAuthorEmail
                            ? gameAuthorEmail === email
                            : normalizeEmail(game.author) === email;
                        const renamedComments = renameCommentAuthors(game.comments, email, nickname);
                        if (isMatchingAuthor || renamedComments.changed) {
                            changedGames.push({
                                id: game.id,
                                data: {
                                    ...(isMatchingAuthor ? { author: nickname, authorEmail: email } : {}),
                                    ...(renamedComments.changed ? { comments: renamedComments.comments } : {})
                                }
                            });
                        }
                    }

                    if (changedGames.length >= 500) {
                        throw new Error("符合的舊遊戲/評論資料超過 Firestore 單次批次上限，未儲存任何變更。");
                    }

                    const { doc, writeBatch } = window.firebaseAPI;
                    const batch = writeBatch(window.firebaseDB);
                    batch.set(doc(window.firebaseDB, "userAccounts", accountKey(user)), {
                        nickname,
                        hidePasswordPrompt: accountData.hidePasswordPrompt
                    }, { merge: true });
                    for (const game of changedGames) {
                        batch.update(doc(window.firebaseDB, "games", game.id), game.data);
                    }
                    await batch.commit();

                    const updatedGames = games.map(game => {
                        const changed = changedGames.find(item => item.id === game.id);
                        return changed ? { ...game, ...changed.data } : game;
                    });
                    setGames(updatedGames);
                    if (activeGame) {
                        const changedActiveGame = changedGames.find(item => item.id === activeGame.id);
                        if (changedActiveGame) setActiveGame({ ...activeGame, ...changedActiveGame.data });
                    }
                    setAccountData({
                        ...accountData,
                        nickname
                    });
                    alert(`設定已儲存，並更新 ${changedGames.length} 筆舊遊戲/評論資料。`);
                } catch (error) {
                    console.error("儲存暱稱失敗", error);
                    alert(`暱稱儲存失敗：${error.message || "請確認 Firestore 權限。"}`);
                } finally {
                    setIsSavingSettings(false);
                }
            };

            const savePasswordSetting = async (e) => {
                e.preventDefault();
                if (accountData.password && settingsCurrentPassword !== accountData.password) {
                    alert("目前密碼值不正確。");
                    return;
                }
                if (!settingsNewPassword.trim()) {
                    alert("請輸入新的密碼值。");
                    return;
                }

                setIsSavingSettings(true);
                try {
                    const { doc, writeBatch } = window.firebaseAPI;
                    const batch = writeBatch(window.firebaseDB);
                    batch.set(doc(window.firebaseDB, "userAccounts", accountKey(user)), {
                        password: settingsNewPassword,
                        hidePasswordPrompt: accountData.hidePasswordPrompt
                    }, { merge: true });
                    await batch.commit();
                    setAccountData({ ...accountData, password: settingsNewPassword });
                    setSettingsCurrentPassword("");
                    setSettingsNewPassword("");
                    alert(accountData.password ? "密碼值已更改。" : "密碼值已設定。");
                } catch (error) {
                    console.error("儲存密碼值失敗", error);
                    alert(`密碼值儲存失敗：${error.message || "請確認 Firestore 權限。"}`);
                } finally {
                    setIsSavingSettings(false);
                }
            };

            const submitNewGame = async (e) => {
                e.preventDefault();
                setIsSavingGame(true);
                try {
                    const { collection, addDoc } = window.firebaseAPI;
                    const originalAuthorEmail = normalizeEmail(newGameForm.originalAuthorEmail);
                    const originalAuthorName = newGameForm.originalAuthorName.trim();
                    if (newGameForm.isDelegated && originalAuthorEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(originalAuthorEmail)) {
                        throw new Error("請輸入有效的原作者 Email，或清空帳號並填寫原作者名稱/綽號。");
                    }
                    if (newGameForm.isDelegated && originalAuthorEmail === normalizeEmail(user)) {
                        throw new Error("原作者帳號不可與代發者相同。");
                    }
                    if (newGameForm.isDelegated && !originalAuthorEmail && !originalAuthorName) {
                        throw new Error("代發時請填原作者帳號或名稱/綽號。");
                    }
                    const gameData = {
                        title: newGameForm.title,
                        url: normalizeSiteUrl(newGameForm.url),
                        type: newGameForm.type,
                        image: await uploadGameImage(newGameForm.imageFile) || 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500&q=80',
                        description: newGameForm.description,
                        authorKeywords: newGameForm.authorKeywords.split(/[,，]/).map(k => k.trim()).filter(k => k),
                        playerKeywords: [],
                        comments: [],
                        author: accountData.nickname || user,
                        authorEmail: user,
                        ...(newGameForm.isDelegated ? {
                            delegation: {
                                status: originalAuthorEmail ? "pending" : "unclaimed",
                                delegateEmail: normalizeEmail(user),
                                delegateName: accountData.nickname || user,
                                originalEmail: originalAuthorEmail,
                                originalName: originalAuthorName
                            }
                        } : {})
                    };
                    const docRef = await addDoc(collection(window.firebaseDB, "games"), gameData);
                    setGames([{ id: docRef.id, ...gameData }, ...games]);
                    setShowAddGame(false);
                    setNewGameForm({ title: '', url: '', type: 'game', image: '', imageFile: null, description: '', authorKeywords: '', isDelegated: false, originalAuthorEmail: '', originalAuthorName: '' });
                } catch (error) {
                    console.error("發佈遊戲失敗", error);
                    alert(`發佈失敗：${error.message || "請確認 Cloudinary preset 與 Firestore 權限。"}`);
                } finally {
                    setIsSavingGame(false);
                }
            };

            // 開啟編輯視窗並載入舊資料
            const openEditModal = () => {
                setEditGameForm({
                    id: activeGame.id,
                    title: activeGame.title,
                    url: activeGame.url,
                    type: activeGame.type || "game",
                    image: activeGame.image,
                    imageFile: null,
                    description: activeGame.description,
                    authorKeywords: (activeGame.authorKeywords || []).join(', ')
                });
                setShowEditGame(true);
            };

            // 送出編輯更新
            const submitEditGame = async (e) => {
                e.preventDefault();
                setIsSavingGame(true);
                try {
                    const { doc, updateDoc } = window.firebaseAPI;
                    const updatedData = {
                        title: editGameForm.title,
                        url: normalizeSiteUrl(editGameForm.url),
                        type: editGameForm.type,
                        image: await uploadGameImage(editGameForm.imageFile) || editGameForm.image || 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500&q=80',
                        description: editGameForm.description,
                        authorKeywords: editGameForm.authorKeywords.split(/[,，]/).map(k => k.trim()).filter(k => k)
                    };
                    
                    await updateDoc(doc(window.firebaseDB, "games", editGameForm.id), updatedData);
                    
                    // 更新本地狀態
                    const newGames = games.map(g => g.id === editGameForm.id ? { ...g, ...updatedData } : g);
                    setGames(newGames);
                    setActiveGame({ ...activeGame, ...updatedData });
                    setShowEditGame(false);
                } catch (error) {
                    console.error("更新遊戲失敗", error);
                    alert(`更新失敗：${error.message || "請確認 Cloudinary preset 與 Firestore 權限。"}`);
                } finally {
                    setIsSavingGame(false);
                }
            };

            const handleAddPlayerKeyword = async () => {
                if (!newPlayerKw.trim() || !user) return;
                const kw = newPlayerKw.trim();
                const gameIndex = games.findIndex(g => g.id === activeGame.id);
                const game = JSON.parse(JSON.stringify(games[gameIndex]));
                
                if (!game.playerKeywords) game.playerKeywords = [];
                if (game.playerKeywords.includes(kw)) return setNewPlayerKw("");

                game.playerKeywords.push(kw);
                
                try {
                    const { doc, updateDoc } = window.firebaseAPI;
                    await updateDoc(doc(window.firebaseDB, "games", activeGame.id), { playerKeywords: game.playerKeywords });
                    
                    const newGames = [...games];
                    newGames[gameIndex] = game;
                    setGames(newGames);
                    setActiveGame(game);
                    setNewPlayerKw("");
                } catch (error) {
                    console.error("更新標籤失敗", error);
                }
            };

            const handleRateGame = async (score) => {
                if (!user || !Number.isInteger(score) || score < 1 || score > 5) return;
                try {
                    const { doc, runTransaction } = window.firebaseAPI;
                    const gameRef = doc(window.firebaseDB, "games", activeGame.id);
                    const updatedRatings = await runTransaction(window.firebaseDB, async transaction => {
                        const gameSnapshot = await transaction.get(gameRef);
                        if (!gameSnapshot.exists()) {
                            throw new Error("找不到這個遊戲，請重新整理頁面。");
                        }
                        const gameData = gameSnapshot.data();
                        const ratings = Array.isArray(gameData.ratings) ? gameData.ratings : [];
                        const email = normalizeEmail(user);
                        const nextRatings = ratings.filter(
                            rating => normalizeEmail(rating.userEmail) !== email
                        );
                        nextRatings.push({ userEmail: email, value: score });
                        transaction.update(gameRef, { ratings: nextRatings });
                        return nextRatings;
                    });

                    const updatedGames = games.map(game =>
                        game.id === activeGame.id ? { ...game, ratings: updatedRatings } : game
                    );
                    setGames(updatedGames);
                    setActiveGame({ ...activeGame, ratings: updatedRatings });
                } catch (error) {
                    console.error("儲存評分失敗", error);
                    alert(`評分失敗：${error.message || "請確認 Firestore 權限後重試。"}`);
                }
            };

            const handleDelegationDecision = async (game, accept) => {
                if (!user || !accountData.password) return;
                setIsHandlingDelegation(true);
                try {
                    const { doc, runTransaction } = window.firebaseAPI;
                    const gameRef = doc(window.firebaseDB, "games", game.id);
                    const result = await runTransaction(window.firebaseDB, async transaction => {
                        const snapshot = await transaction.get(gameRef);
                        if (!snapshot.exists()) throw new Error("找不到這個網站，請重新整理。");

                        const currentGame = snapshot.data();
                        const delegation = currentGame.delegation;
                        if (
                            delegation?.status !== "pending" ||
                            normalizeEmail(delegation.originalEmail) !== normalizeEmail(user)
                        ) {
                            throw new Error("此代發接收邀請已失效或不屬於目前帳號。");
                        }

                        const nextDelegation = {
                            ...delegation,
                            status: accept ? "accepted" : "declined",
                            ...(accept ? { acceptedAt: Date.now() } : { declinedAt: Date.now() })
                        };
                        const update = {
                            delegation: nextDelegation,
                            ...(accept ? {
                                author: accountData.nickname || delegation.originalName || user,
                                authorEmail: normalizeEmail(user)
                            } : {})
                        };
                        transaction.update(gameRef, update);
                        return { ...currentGame, ...update };
                    });

                    setGames(games.map(item => item.id === game.id ? { ...item, ...result } : item));
                    if (activeGame?.id === game.id) setActiveGame({ ...activeGame, ...result });
                } catch (error) {
                    console.error("處理代發邀請失敗", error);
                    alert(`處理失敗：${error.message || "請確認 Firestore 權限後重試。"}`);
                } finally {
                    setIsHandlingDelegation(false);
                }
            };

            const deleteActiveSite = async (e) => {
                e.preventDefault();
                if (!activeGame || !user) return;
                if (deleteConfirmationText.trim() !== activeGame.title.trim()) {
                    alert("輸入的網站名稱不符，沒有刪除。");
                    return;
                }

                setIsDeletingSite(true);
                try {
                    const { doc, runTransaction, Timestamp } = window.firebaseAPI;
                    const siteRef = doc(window.firebaseDB, "games", activeGame.id);
                    const now = Date.now();
                    const deletedSite = await runTransaction(window.firebaseDB, async transaction => {
                        const snapshot = await transaction.get(siteRef);
                        if (!snapshot.exists()) throw new Error("找不到這個網站，請重新整理。");

                        const currentSite = snapshot.data();
                        if (isDeletedSite(currentSite)) throw new Error("這個網站已經在刪除期限內。");
                        if (getListingManagerEmail(currentSite) !== normalizeEmail(user)) {
                            throw new Error("只有目前管理者可以刪除此網站。");
                        }

                        const deletion = {
                            deletedAt: Timestamp.fromMillis(now),
                            deletedByEmail: normalizeEmail(user),
                            purgeAt: Timestamp.fromMillis(now + DELETE_GRACE_PERIOD_MS)
                        };
                        transaction.update(siteRef, deletion);
                        return { ...currentSite, ...deletion };
                    });

                    setGames(games.map(site => site.id === activeGame.id ? { ...site, ...deletedSite } : site));
                    setActiveGame(null);
                    setDeleteConfirmationText("");
                    setShowDeleteConfirmation(false);
                    setShowDeletedSites(true);
                } catch (error) {
                    console.error("刪除網站失敗", error);
                    alert(`刪除失敗：${error.message || "請確認 Firestore 權限後重試。"}`);
                } finally {
                    setIsDeletingSite(false);
                }
            };

            const restoreDeletedSite = async (site) => {
                if (!user || restoringSiteId) return;
                setRestoringSiteId(site.id);
                try {
                    const { doc, runTransaction, Timestamp } = window.firebaseAPI;
                    const siteRef = doc(window.firebaseDB, "games", site.id);
                    const restoredSite = await runTransaction(window.firebaseDB, async transaction => {
                        const snapshot = await transaction.get(siteRef);
                        if (!snapshot.exists()) throw new Error("找不到這個網站，可能已超過復原期限或已被刪除。");

                        const currentSite = snapshot.data();
                        if (!isDeletedSite(currentSite)) throw new Error("這個網站已經復原。");
                        if (normalizeEmail(currentSite.deletedByEmail) !== normalizeEmail(user)) {
                            throw new Error("只有刪除者可以復原這個網站。");
                        }
                        if (timestampMillis(currentSite.purgeAt) <= Timestamp.now().toMillis()) {
                            throw new Error("三天復原期限已過，網站無法復原。");
                        }

                        transaction.update(siteRef, {
                            deletedAt: null,
                            deletedByEmail: null,
                            purgeAt: null
                        });
                        return { ...currentSite, deletedAt: null, deletedByEmail: null, purgeAt: null };
                    });

                    setGames(games.map(item => item.id === site.id ? { ...item, ...restoredSite } : item));
                } catch (error) {
                    console.error("復原網站失敗", error);
                    alert(`復原失敗：${error.message || "請確認 Firestore 權限後重試。"}`);
                } finally {
                    setRestoringSiteId("");
                }
            };

            const handleAddReply = async (gameId, parentCommentId, text) => {
                const newComment = {
                    id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                    author: accountData.nickname || user,
                    authorEmail: user,
                    text,
                    replies: []
                };
                const gameIndex = games.findIndex(g => g.id === gameId);
                const game = JSON.parse(JSON.stringify(games[gameIndex])); 
                
                const addReplyToTree = (commentsList) => {
                    for (let c of commentsList) {
                        if (c.id === parentCommentId) {
                            c.replies.push(newComment);
                            return true;
                        }
                        if (c.replies && addReplyToTree(c.replies)) return true;
                    }
                    return false;
                };

                game.comments = game.comments || [];
                if (parentCommentId === null) {
                    game.comments.push(newComment);
                } else {
                    addReplyToTree(game.comments);
                }
                
                try {
                    const { doc, updateDoc } = window.firebaseAPI;
                    await updateDoc(doc(window.firebaseDB, "games", gameId), { comments: game.comments });
                    
                    const newGames = [...games];
                    newGames[gameIndex] = game;
                    setGames(newGames);
                    setActiveGame(game);
                } catch (error) {
                    console.error("評論失敗", error);
                }
            };

            const deletedSites = user
                ? games.filter(site =>
                    isDeletedSite(site) &&
                    normalizeEmail(site.deletedByEmail) === normalizeEmail(user) &&
                    timestampMillis(site.purgeAt) > currentTime
                )
                : [];
            const categoryGames = showDeletedSites
                ? deletedSites
                : games.filter(game => !isDeletedSite(game) && (game.type || "game") === activeTab);
            const getSearchResults = () => {
                if (!searchQuery) return { byName: categoryGames, byAuthorKw: [], byPlayerKw: [], byDesc: [] };
                const q = searchQuery.toLowerCase();
                return {
                    byName: categoryGames.filter(g => g.title.toLowerCase().includes(q)),
                    byAuthorKw: categoryGames.filter(g => (g.authorKeywords||[]).some(k => k.toLowerCase().includes(q))),
                    byPlayerKw: categoryGames.filter(g => (g.playerKeywords||[]).some(k => k.toLowerCase().includes(q))),
                    byDesc: categoryGames.filter(g => g.description.toLowerCase().includes(q))
                };
            };
            const searchResults = getSearchResults();
            const visibleGames = categoryGames;

            return (
                <div className="max-w-5xl mx-auto p-4">
                    <nav className="bg-white p-4 rounded-lg shadow mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                        <h1 className="text-2xl font-bold text-blue-600 cursor-pointer" onClick={() => { setActiveGame(null); setShowDeletedSites(false); setSearchQuery(""); }}>網站分享平台</h1>
                        
                        {!activeGame && !showDeletedSites && (
                            <input 
                                type="text" 
                                placeholder="搜尋網站、關鍵字或簡介..." 
                                className="border p-2 rounded w-full md:w-1/3"
                                value={searchQuery}
                                onChange={e => setSearchQuery(e.target.value)}
                            />
                        )}

                        <div className="flex items-center gap-4">
                            {user && (
                                <button
                                    onClick={() => {
                                        setActiveGame(null);
                                        setShowDeletedSites(!showDeletedSites);
                                        setSearchQuery("");
                                    }}
                                    className="bg-gray-200 px-3 py-2 rounded text-sm"
                                >
                                    {showDeletedSites ? "返回網站列表" : `已刪除網站（${deletedSites.length}）`}
                                </button>
                            )}
                            {user && pendingDelegationClaims.length > 0 && (
                                <button onClick={() => setShowDelegationInbox(true)} className="bg-amber-100 text-amber-800 px-3 py-2 rounded text-sm">
                                    待處理代發（{pendingDelegationClaims.length}）
                                </button>
                            )}
                            {user && <button onClick={() => setShowAddGame(true)} className="bg-green-500 text-white px-4 py-2 rounded text-sm">發佈網站</button>}
                            
                            {user ? (
                                <>
                                    <span className="text-gray-700">歡迎, {accountData.nickname || user}</span>
                                    <button onClick={openSettings} className="bg-gray-200 px-3 py-2 rounded text-sm">設定</button>
                                    <button onClick={() => { setUser(null); setAccountData({ nickname: "", password: "", hidePasswordPrompt: false }); setShowDeletedSites(false); }} className="text-red-500 text-sm">登出</button>
                                </>
                            ) : (
                                <div className="flex gap-2">
                                    <input 
                                        type="text" 
                                        placeholder="信箱 (@gmail.com / @st.tc.edu.tw)" 
                                        className="border p-2 rounded text-sm w-64"
                                        value={loginInput}
                                        onChange={e => setLoginInput(e.target.value)}
                                    />
                                    <input
                                        type="password"
                                        placeholder="密碼（已設定者必填）"
                                        className="border p-2 rounded text-sm w-44"
                                        value={loginPassword}
                                        onChange={e => setLoginPassword(e.target.value)}
                                    />
                                    <button onClick={handleLogin} disabled={isLoggingIn} className="bg-blue-600 text-white px-4 py-2 rounded disabled:opacity-50">{isLoggingIn ? "登入中..." : "登入"}</button>
                                </div>
                            )}
                        </div>
                    </nav>

                    {!activeGame && !showDeletedSites && (
                        <div className="flex gap-2 mb-6" role="tablist" aria-label="網站分類">
                            <button
                                type="button"
                                role="tab"
                                aria-selected={activeTab === "game"}
                                onClick={() => { setShowDeletedSites(false); setActiveTab("game"); }}
                                className={`px-4 py-2 rounded ${activeTab === "game" ? "bg-blue-600 text-white" : "bg-white text-gray-700"}`}
                            >
                                遊戲網站
                            </button>
                            <button
                                type="button"
                                role="tab"
                                aria-selected={activeTab === "function"}
                                onClick={() => { setShowDeletedSites(false); setActiveTab("function"); }}
                                className={`px-4 py-2 rounded ${activeTab === "function" ? "bg-blue-600 text-white" : "bg-white text-gray-700"}`}
                            >
                                功能網站
                            </button>
                        </div>
                    )}

                    {/* 發佈網站彈跳視窗 */}
                    {showAddGame && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center p-4 z-50">
                            <div className="bg-white p-6 rounded-lg w-full max-w-md">
                                <h2 className="text-xl font-bold mb-4">發佈新網站</h2>
                                <form onSubmit={submitNewGame} className="space-y-3">
                                    <input required placeholder="網站名稱" className="border p-2 w-full rounded" value={newGameForm.title} onChange={e=>setNewGameForm({...newGameForm, title: e.target.value})} />
                                    <input required type="text" placeholder="網站網址（支援 Gemini 分享網址）" className="border p-2 w-full rounded" value={newGameForm.url} onChange={e=>setNewGameForm({...newGameForm, url: e.target.value})} />
                                    <select className="border p-2 w-full rounded" value={newGameForm.type} onChange={e=>setNewGameForm({...newGameForm, type: e.target.value})}>
                                        <option value="game">遊戲網站</option>
                                        <option value="function">功能網站</option>
                                    </select>
                                    <label className="flex items-center gap-2 text-sm">
                                        <input type="checkbox" checked={newGameForm.isDelegated} onChange={e=>setNewGameForm({...newGameForm, isDelegated: e.target.checked})} />
                                        這是代發網站
                                    </label>
                                    {newGameForm.isDelegated && (
                                        <div className="space-y-2 rounded border border-amber-200 bg-amber-50 p-3">
                                            <p className="text-sm text-amber-800">代發期間由你管理；原作者接收後，管理權會轉給原作者。</p>
                                            <input type="email" placeholder="原作者帳號（知道時填寫）" className="border p-2 w-full rounded" value={newGameForm.originalAuthorEmail} onChange={e=>setNewGameForm({...newGameForm, originalAuthorEmail: e.target.value})} />
                                            <input placeholder={newGameForm.originalAuthorEmail ? "原作者名稱/綽號（選填）" : "原作者名稱/綽號（不知道帳號時必填）"} className="border p-2 w-full rounded" value={newGameForm.originalAuthorName} onChange={e=>setNewGameForm({...newGameForm, originalAuthorName: e.target.value})} />
                                        </div>
                                    )}
                                    <ImageUploadField inputId="new-game-image" file={newGameForm.imageFile} currentImage={newGameForm.image} onFileChange={imageFile => setNewGameForm({...newGameForm, imageFile})} />
                                    <textarea required placeholder="遊戲簡介" className="border p-2 w-full rounded h-24" value={newGameForm.description} onChange={e=>setNewGameForm({...newGameForm, description: e.target.value})} />
                                    <input placeholder="作者關鍵字 (用逗號分隔)" className="border p-2 w-full rounded" value={newGameForm.authorKeywords} onChange={e=>setNewGameForm({...newGameForm, authorKeywords: e.target.value})} />
                                    <div className="flex justify-end gap-2 mt-4">
                                        <button type="button" onClick={() => setShowAddGame(false)} className="bg-gray-300 px-4 py-2 rounded">取消</button>
                                        <button type="submit" disabled={isSavingGame} className="bg-blue-600 text-white px-4 py-2 rounded disabled:opacity-50">{isSavingGame ? "圖片上傳中..." : "確認發佈"}</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 編輯遊戲彈跳視窗 */}
                    {showEditGame && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center p-4 z-50">
                            <div className="bg-white p-6 rounded-lg w-full max-w-md">
                                <h2 className="text-xl font-bold mb-4">編輯網站</h2>
                                <form onSubmit={submitEditGame} className="space-y-3">
                                    <input required placeholder="網站名稱" className="border p-2 w-full rounded" value={editGameForm.title} onChange={e=>setEditGameForm({...editGameForm, title: e.target.value})} />
                                    <input required type="text" placeholder="網站網址（支援 Gemini 分享網址）" className="border p-2 w-full rounded" value={editGameForm.url} onChange={e=>setEditGameForm({...editGameForm, url: e.target.value})} />
                                    <select className="border p-2 w-full rounded" value={editGameForm.type} onChange={e=>setEditGameForm({...editGameForm, type: e.target.value})}>
                                        <option value="game">遊戲網站</option>
                                        <option value="function">功能網站</option>
                                    </select>
                                    <ImageUploadField inputId="edit-game-image" file={editGameForm.imageFile} currentImage={editGameForm.image} onFileChange={imageFile => setEditGameForm({...editGameForm, imageFile})} />
                                    <textarea required placeholder="遊戲簡介" className="border p-2 w-full rounded h-24" value={editGameForm.description} onChange={e=>setEditGameForm({...editGameForm, description: e.target.value})} />
                                    <input placeholder="作者關鍵字 (用逗號分隔)" className="border p-2 w-full rounded" value={editGameForm.authorKeywords} onChange={e=>setEditGameForm({...editGameForm, authorKeywords: e.target.value})} />
                                    <div className="flex justify-end gap-2 mt-4">
                                        <button type="button" onClick={() => setShowEditGame(false)} className="bg-gray-300 px-4 py-2 rounded">取消</button>
                                        <button type="submit" disabled={isSavingGame} className="bg-yellow-500 text-white px-4 py-2 rounded disabled:opacity-50">{isSavingGame ? "圖片上傳中..." : "儲存變更"}</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showDeleteConfirmation && activeGame && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center p-4 z-[60]">
                            <div className="bg-white p-6 rounded-lg w-full max-w-md">
                                <h2 className="text-xl font-bold mb-3 text-red-700">確認刪除網站</h2>
                                <p className="text-sm text-gray-700 mb-2">網站會立即從一般列表隱藏。你可以在三天內從「已刪除網站」復原；逾期後將無法透過網站復原，但資料仍會保留在 Firestore，需手動清除。</p>
                                <p className="font-semibold mb-3">請輸入網站名稱：<span className="text-red-700">{activeGame.title}</span></p>
                                <form onSubmit={deleteActiveSite} className="space-y-3">
                                    <input
                                        autoComplete="off"
                                        required
                                        className="border p-2 w-full rounded"
                                        placeholder="輸入完整網站名稱"
                                        value={deleteConfirmationText}
                                        onChange={e => setDeleteConfirmationText(e.target.value)}
                                    />
                                    <div className="flex justify-end gap-2">
                                        <button type="button" onClick={() => setShowDeleteConfirmation(false)} className="bg-gray-300 px-4 py-2 rounded">取消</button>
                                        <button
                                            type="submit"
                                            disabled={isDeletingSite || deleteConfirmationText.trim() !== activeGame.title.trim()}
                                            className="bg-red-600 text-white px-4 py-2 rounded disabled:opacity-50"
                                        >
                                            {isDeletingSite ? "刪除中..." : "確認刪除"}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showDelegationInbox && pendingDelegationClaims.length > 0 && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center p-4 z-[60]">
                            <div className="bg-white p-6 rounded-lg w-full max-w-lg max-h-[85vh] overflow-y-auto">
                                <h2 className="text-xl font-bold mb-2">代發網站接收邀請</h2>
                                <p className="text-sm text-amber-700 mb-4">接收後，網站管理權會轉給你，代發者將不再有編輯權。請確認你認識代發者和網站。此頁的 Email/密碼登入並非 Firebase 身分驗證，無法安全防止冒用。</p>
                                <div className="space-y-4">
                                    {pendingDelegationClaims.map(game => (
                                        <div key={game.id} className="border rounded p-3">
                                            <h3 className="font-semibold">{game.title}</h3>
                                            <p className="text-sm text-gray-600">代發者：{game.delegation.delegateName || game.author}</p>
                                            <div className="flex justify-end gap-2 mt-3">
                                                <button type="button" disabled={isHandlingDelegation} onClick={() => handleDelegationDecision(game, false)} className="bg-gray-200 px-3 py-2 rounded disabled:opacity-50">拒絕</button>
                                                <button type="button" disabled={isHandlingDelegation} onClick={() => handleDelegationDecision(game, true)} className="bg-blue-600 text-white px-3 py-2 rounded disabled:opacity-50">接收並取得管理權</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="text-right mt-4">
                                    <button type="button" onClick={() => setShowDelegationInbox(false)} className="text-blue-600 hover:underline">稍後處理</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showPasswordSetup && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center p-4 z-50">
                            <div className="bg-white p-6 rounded-lg w-full max-w-md">
                                <h2 className="text-xl font-bold mb-3">設定密碼值</h2>
                                <p className="text-sm text-amber-700 mb-4">此密碼只是存檔中的一般文字，不是安全驗證；不要使用任何真實或重複使用的密碼。</p>
                                <form onSubmit={savePasswordSetup} className="space-y-3">
                                    <input autoComplete="new-password" type="password" required placeholder="輸入要儲存的密碼值" className="border p-2 w-full rounded" value={setupPassword} onChange={e => setSetupPassword(e.target.value)} />
                                    <label className="flex items-center gap-2 text-sm text-gray-700">
                                        <input type="checkbox" checked={hidePasswordPrompt} onChange={e => setHidePasswordPrompt(e.target.checked)} />
                                        以後不再顯示設定密碼提醒
                                    </label>
                                    <div className="flex justify-end gap-2">
                                        <button type="button" onClick={skipPasswordSetup} className="bg-gray-300 px-4 py-2 rounded">這次略過</button>
                                        <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded">儲存密碼值</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showSettings && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center p-4 z-50">
                            <div className="bg-white p-6 rounded-lg w-full max-w-md">
                                <h2 className="text-xl font-bold mb-3">帳號設定</h2>
                                <p className="text-sm text-amber-700 mb-4">密碼以一般文字儲存在存檔中，僅供這個頁面比對，不是安全登入密碼；請勿使用真實密碼。</p>
                                <form onSubmit={saveNickname} className="space-y-3">
                                    <h3 className="font-semibold">暱稱</h3>
                                    <label className="block text-sm font-medium">暱稱
                                        <input maxLength="40" className="border p-2 w-full rounded mt-1" value={settingsNickname} onChange={e => setSettingsNickname(e.target.value)} />
                                    </label>
                                    <button type="submit" disabled={isSavingSettings} className="bg-blue-600 text-white px-4 py-2 rounded disabled:opacity-50">{isSavingSettings ? "儲存中..." : "單獨儲存暱稱"}</button>
                                </form>

                                <hr className="my-5" />

                                <form onSubmit={savePasswordSetting} className="space-y-3">
                                    <h3 className="font-semibold">{accountData.password ? "更改密碼值" : "設定密碼值"}</h3>
                                    {accountData.password && (
                                        <label className="block text-sm font-medium">目前密碼值
                                            <input autoComplete="current-password" type="password" className="border p-2 w-full rounded mt-1" value={settingsCurrentPassword} onChange={e => setSettingsCurrentPassword(e.target.value)} />
                                        </label>
                                    )}
                                    <label className="block text-sm font-medium">{accountData.password ? "新密碼值" : "密碼值"}
                                        <input required autoComplete="new-password" type="password" className="border p-2 w-full rounded mt-1" value={settingsNewPassword} onChange={e => setSettingsNewPassword(e.target.value)} />
                                    </label>
                                    <button type="submit" disabled={isSavingSettings} className="bg-indigo-600 text-white px-4 py-2 rounded disabled:opacity-50">{isSavingSettings ? "儲存中..." : accountData.password ? "單獨更改密碼" : "單獨設定密碼"}</button>
                                </form>

                                <div className="flex justify-end pt-4">
                                    <button type="button" onClick={() => setShowSettings(false)} className="bg-gray-300 px-4 py-2 rounded">關閉</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeGame ? (
                        <div className="bg-white p-6 rounded-lg shadow">
                            <button onClick={() => setActiveGame(null)} className="text-blue-500 mb-4 hover:underline">← 返回列表</button>
                            
                            <img src={activeGame.image} alt={activeGame.title} className="w-full h-64 object-cover rounded-lg mb-4" />
                            
                            <div className="flex justify-between items-start mb-2">
                                <div>
                                    <h2 className="text-3xl font-bold">{activeGame.title}</h2>
                                    <p className="text-sm text-gray-500 mt-1">
                                        {activeGame.delegation ? (
                                            <>
                                                <span className="font-semibold text-amber-700">代發網站</span>
                                                {" · "}代發者：{activeGame.delegation.delegateName || activeGame.author || "匿名"}
                                                {" · "}原作者：{activeGame.delegation.originalName || activeGame.delegation.originalEmail || "未提供"}
                                                {activeGame.delegation.status === "pending" && "（等待原作者接收）"}
                                                {activeGame.delegation.status === "accepted" && "（原作者已接收）"}
                                                {activeGame.delegation.status === "declined" && "（原作者已拒絕接收）"}
                                            </>
                                        ) : `發佈者：${activeGame.author || '匿名'}`}
                                    </p>
                                </div>
                                <div className="flex gap-2">
                                    <a
                                        href={activeGame.url}
                                        target={isGeminiShareUrl(activeGame.url) ? "_self" : "_blank"}
                                        rel="noopener noreferrer"
                                        className="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 text-center"
                                    >
                                        {isGeminiShareUrl(activeGame.url)
                                            ? "開啟 Gemini 分享"
                                            : (activeGame.type || "game") === "game" ? "開始遊玩" : "開啟網站"}
                                    </a>
                                    {/* 只有作者能看到編輯按鈕 */}
                                    {user && normalizeEmail(user) === getListingManagerEmail(activeGame) && (
                                        <>
                                            <button onClick={openEditModal} className="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600">編輯網站</button>
                                            <button
                                                onClick={() => {
                                                    setDeleteConfirmationText("");
                                                    setShowDeleteConfirmation(true);
                                                }}
                                                className="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700"
                                            >
                                                刪除網站
                                            </button>
                                        </>
                                    )}
                                </div>
                            </div>
                            {activeGame.delegation?.status === "pending" && (
                                <p className="text-sm text-amber-700 mb-3">目前由代發者管理；原作者登入具有密碼值的帳號後，可選擇是否接收管理權。此頁登入無法安全驗證身分。</p>
                            )}
                            {activeGame.delegation?.status === "unclaimed" && (
                                <p className="text-sm text-amber-700 mb-3">此網站由 {activeGame.delegation.originalName} 委託代發，原作者帳號未提供，因此目前由代發者管理。</p>
                            )}
                            
                            <div className="mb-4 mt-4">
                                <h3 className="font-bold text-gray-700">簡介：</h3>
                                <p className="text-gray-600 whitespace-pre-wrap">{activeGame.description}</p>
                            </div>

                            <RatingSection ratings={activeGame.ratings} currentUser={user} onRate={handleRateGame} />
                            
                            <div className="flex flex-col gap-3 mb-6 text-sm border-t pt-4">
                                <div>
                                    <span className="font-bold">作者設定關鍵字：</span> 
                                    {(activeGame.authorKeywords||[]).map(k => <span key={k} className="bg-blue-100 text-blue-800 px-2 py-1 rounded mx-1">{k}</span>)}
                                </div>
                                <div className="flex items-center flex-wrap gap-2">
                                    <span className="font-bold">玩家標籤：</span> 
                                    {(activeGame.playerKeywords||[]).map(k => <span key={k} className="bg-green-100 text-green-800 px-2 py-1 rounded mx-1">{k}</span>)}
                                    {user && (
                                        <div className="flex gap-1 ml-2">
                                            <input type="text" value={newPlayerKw} onChange={e=>setNewPlayerKw(e.target.value)} placeholder="新增玩家標籤..." className="border rounded px-2 py-1 w-32" />
                                            <button onClick={handleAddPlayerKeyword} className="bg-green-500 text-white px-2 py-1 rounded">+</button>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <hr className="my-6" />
                            
                            <h3 className="text-xl font-bold mb-4">玩家評論</h3>
                            {user ? (
                                <div className="mb-6 flex gap-2">
                                    <input type="text" id="mainComment" className="border p-2 rounded w-full" placeholder="寫下你的評論..." />
                                    <button onClick={() => {
                                        const input = document.getElementById('mainComment');
                                        if(input.value.trim()){
                                            handleAddReply(activeGame.id, null, input.value);
                                            input.value = '';
                                        }
                                    }} className="bg-blue-600 text-white px-4 py-2 rounded">發佈</button>
                                </div>
                            ) : showDeletedSites ? (
                                <section className="bg-white p-6 rounded-lg shadow">
                                    <h2 className="text-xl font-bold mb-2">已刪除網站</h2>
                                    <p className="text-sm text-gray-600 mb-5">只有你刪除的網站會顯示在這裡。可在三天內復原；逾期後不再提供復原，資料仍保留在 Firestore，需手動清除。</p>
                                    {!hasLoadedGames ? (
                                        <p className="text-center text-gray-500 py-10">正在載入網站...</p>
                                    ) : deletedSites.length ? (
                                        <div className="space-y-3">
                                            {deletedSites.map(site => (
                                                <div key={site.id} className="border rounded-lg p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                                    <div>
                                                        <h3 className="font-bold">{site.title}</h3>
                                                        <p className="text-sm text-gray-600">
                                                            {Math.ceil((timestampMillis(site.purgeAt) - currentTime) / (24 * 60 * 60 * 1000))} 天後無法復原
                                                        </p>
                                                    </div>
                                                    <button
                                                        onClick={() => restoreDeletedSite(site)}
                                                        disabled={restoringSiteId === site.id}
                                                        className="bg-blue-600 text-white px-4 py-2 rounded disabled:opacity-50"
                                                    >
                                                        {restoringSiteId === site.id ? "復原中..." : "復原網站"}
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <p className="text-center text-gray-500 py-10">沒有可復原的網站。</p>
                                    )}
                                </section>
                            ) : (
                                <p className="text-red-500 mb-6">請先登入以發表評論或新增標籤</p>
                            )}

                            <div>
                                {(activeGame.comments||[]).map(comment => (
                                    <CommentBlock key={comment.id} comment={comment} currentUser={user} onReply={(parentId, text) => handleAddReply(activeGame.id, parentId, text)} />
                                ))}
                            </div>
                        </div>
                    ) : (
                        <div>
                            {searchQuery ? (
                                <div className="space-y-6">
                                    {searchResults.byName.length > 0 && <ResultSection title="🎯 網站名稱相符" games={searchResults.byName} onSelect={setActiveGame} />}
                                    {searchResults.byAuthorKw.length > 0 && <ResultSection title="🏷️ 作者關鍵字相符" games={searchResults.byAuthorKw} onSelect={setActiveGame} />}
                                    {searchResults.byPlayerKw.length > 0 && <ResultSection title="🎮 玩家關鍵字相符" games={searchResults.byPlayerKw} onSelect={setActiveGame} />}
                                    {searchResults.byDesc.length > 0 && <ResultSection title="📖 簡介相符" games={searchResults.byDesc} onSelect={setActiveGame} />}
                                    {Object.values(searchResults).every(arr => arr.length === 0) && <p className="text-center text-gray-500 mt-10">找不到相關遊戲</p>}
                                </div>
                            ) : (
                                <ResultSection title={activeTab === "game" ? "🌟 遊戲網站" : "🧰 功能網站"} games={visibleGames} onSelect={setActiveGame} />
                            )}
                            {visibleGames.length === 0 && !searchQuery && (
                                <div className="text-center text-gray-500 mt-20">{hasLoadedGames ? "此分頁目前沒有網站。" : "正在載入網站..."}</div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const ResultSection = ({ title, games, onSelect }) => (
            <div>
                <h2 className="text-xl font-bold text-gray-800 mb-4">{title}</h2>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {games.map(game => (
                        <div key={game.id} className="bg-white rounded-lg shadow overflow-hidden hover:shadow-lg transition cursor-pointer flex flex-col" onClick={() => onSelect(game)}>
                            <img src={game.image} className="w-full h-40 object-cover" />
                            <div className="p-4 flex flex-col flex-grow">
                                <h3 className="font-bold text-lg">{game.title}</h3>
                                <p className="text-xs text-blue-500 mb-2">
                                    {game.delegation
                                        ? `代發網站 · 代發者: ${game.delegation.delegateName || game.author || '匿名'}`
                                        : `發佈者: ${game.author || '匿名'}`}
                                </p>
                                <p className="text-xs text-gray-500 mb-2">{(game.type || "game") === "game" ? "遊戲網站" : "功能網站"}</p>
                                <p className="text-sm text-yellow-600 mb-2">
                                    ★ {getRatingStats(game.ratings).count
                                        ? `${getRatingStats(game.ratings).average.toFixed(1)}（${getRatingStats(game.ratings).count} 人）`
                                        : "尚無評分"}
                                </p>
                                <p className="text-gray-600 text-sm truncate">{game.description}</p>
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
